<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Registro Administrador</title>

    <link
        rel="stylesheet"
        href="/css/admin.css"
    >

</head>

<body>

<div class="login-pagina">

    <div class="login-card">

        <img
            class="login-logo-imagen"
            src="/img/logo-transparente.png"
            alt="Kreditmx"
        >

        <h1>
            Registro
        </h1>

        <p>
            Crea tu cuenta de administrador.
        </p>


        <form id="registroForm">

            <div class="campo-admin">

                <label>
                    Nombre completo
                </label>

                <input
                    type="text"
                    id="nombre_completo"
                    placeholder="Nombre completo"
                    required
                >

            </div>


            <div class="campo-admin">

                <label>
                    Nombre de usuario
                </label>

                <input
                    type="text"
                    id="usuario"
                    placeholder="Nombre de usuario"
                    required
                >

            </div>


            <div class="campo-admin">

                <label>
                    Correo
                </label>

                <input
                    type="email"
                    id="correo"
                    placeholder="correo@ejemplo.com"
                    required
                >

            </div>


            <div class="campo-admin" style="position: relative;">

                <label>
                    Contraseña
                </label>

                <input
                    type="password"
                    id="contrasena"
                    placeholder="Mínimo 8 caracteres"
                    minlength="8"
                    required
                    style="padding-right: 38px;"
                >

                <button
                    type="button"
                    id="togglePassword"
                    style="
                        position: absolute; right: 8px; top: 50%;
                        transform: translateY(-50%); background: none;
                        border: none; cursor: pointer; padding: 4px;
                        color: #555; line-height: 0;
                    "
                    title="Mostrar contraseña"
                    aria-label="Mostrar contraseña"
                >
                    <svg id="iconoMostrar" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                    <svg id="iconoOcultar" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: none;"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
                </button>

            </div>


            <p
                id="registroError"
                style="color: #c0392b; display: none;"
            >
            </p>


            <button
                type="submit"
                class="btn-admin"
            >
                Crear cuenta
            </button>

        </form>


        <p style="text-align: center; margin-top: 15px;">

            <a href="/login" style="font-size: 14px;">
                Ya tengo cuenta
            </a>

        </p>

    </div>

</div>


<script>

// Mostrar / ocultar la contrasena
const campoPassword = document.getElementById("contrasena");
const botonMostrar = document.getElementById("togglePassword");

botonMostrar
    .addEventListener(
        "click",
        function() {

            const visible = campoPassword.type === "text";
            campoPassword.type = visible ? "password" : "text";
            document.getElementById("iconoMostrar").style.display = visible ? "" : "none";
            document.getElementById("iconoOcultar").style.display = visible ? "none" : "";
            botonMostrar.title = visible ? "Mostrar contraseña" : "Ocultar contraseña";
            campoPassword.focus();

        }
    );

document
    .getElementById("registroForm")
    .addEventListener(
        "submit",
        async function(event) {

            event.preventDefault();

            const errorParrafo = document.getElementById("registroError");
            errorParrafo.style.display = "none";

            if (document.getElementById("contrasena").value.length < 8) {
                errorParrafo.textContent = "La contraseña debe tener al menos 8 caracteres.";
                errorParrafo.style.display = "block";
                return;
            }

            try {

                const respuesta = await fetch("/api/registro-admin", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        nombre_completo: document.getElementById("nombre_completo").value,
                        usuario: document.getElementById("usuario").value,
                        correo: document.getElementById("correo").value,
                        contrasena: document.getElementById("contrasena").value,
                    }),
                });

                const datos = await respuesta.json();

                if (!respuesta.ok) {
                    errorParrafo.textContent = datos.error || "No se pudo registrar la cuenta.";
                    errorParrafo.style.display = "block";
                    return;
                }

                window.location.href = "/login";

            } catch (error) {
                errorParrafo.textContent = "Error de conexión. Intenta de nuevo.";
                errorParrafo.style.display = "block";
            }

        }
    );

</script>

</body>

</html>
