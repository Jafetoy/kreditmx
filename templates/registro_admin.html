<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Registro Administrador</title>

    <link
        rel="stylesheet"
        href="/css/admin.css"
    >

</head>

<body>

<div class="login-pagina">

    <div class="login-card">

        <img
            class="login-logo-imagen"
            src="/img/logo-transparente.png"
            alt="Kreditmx"
        >

        <h1>
            Registro
        </h1>

        <p>
            Crea tu cuenta de administrador.
        </p>


        <form id="registroForm">

            <div class="campo-admin">

                <label>
                    Nombre completo
                </label>

                <input
                    type="text"
                    id="nombre_completo"
                    placeholder="Nombre completo"
                    required
                >

            </div>


            <div class="campo-admin">

                <label>
                    Nombre de usuario
                </label>

                <input
                    type="text"
                    id="usuario"
                    placeholder="Nombre de usuario"
                    required
                >

            </div>


            <div class="campo-admin">

                <label>
                    Correo
                </label>

                <input
                    type="email"
                    id="correo"
                    placeholder="correo@ejemplo.com"
                    required
                >

            </div>


            <div class="campo-admin">

                <label>
                    Contraseña
                </label>

                <input
                    type="password"
                    id="contrasena"
                    placeholder="Mínimo 8 caracteres"
                    minlength="8"
                    required
                >

            </div>


            <p
                id="registroError"
                style="color: #c0392b; display: none;"
            >
            </p>


            <button
                type="submit"
                class="btn-admin"
            >
                Crear cuenta
            </button>

        </form>


        <p style="text-align: center; margin-top: 15px;">

            <a href="/login" style="font-size: 14px;">
                Ya tengo cuenta
            </a>

        </p>

    </div>

</div>


<script>

document
    .getElementById("registroForm")
    .addEventListener(
        "submit",
        async function(event) {

            event.preventDefault();

            const errorParrafo = document.getElementById("registroError");
            errorParrafo.style.display = "none";

            if (document.getElementById("contrasena").value.length < 8) {
                errorParrafo.textContent = "La contraseña debe tener al menos 8 caracteres.";
                errorParrafo.style.display = "block";
                return;
            }

            try {

                const respuesta = await fetch("/api/registro-admin", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        nombre_completo: document.getElementById("nombre_completo").value,
                        usuario: document.getElementById("usuario").value,
                        correo: document.getElementById("correo").value,
                        contrasena: document.getElementById("contrasena").value,
                    }),
                });

                const datos = await respuesta.json();

                if (!respuesta.ok) {
                    errorParrafo.textContent = datos.error || "No se pudo registrar la cuenta.";
                    errorParrafo.style.display = "block";
                    return;
                }

                window.location.href = "/login";

            } catch (error) {
                errorParrafo.textContent = "Error de conexión. Intenta de nuevo.";
                errorParrafo.style.display = "block";
            }

        }
    );

</script>

</body>

</html>
